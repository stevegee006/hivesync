# Builds and publishes the image to Docker Hub on a version tag.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME  your Docker Hub account
#   DOCKERHUB_TOKEN     a Docker Hub access token, not your password
#
# Pull requests build but do not push, so a fork cannot publish.
name: docker-publish

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned versions
        run: cat versions.env >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/hivesync
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RCLONE_VERSION=${{ env.RCLONE_VERSION }}
            RCLONE_SHA256_AMD64=${{ env.RCLONE_SHA256_AMD64 }}
            RCLONE_SHA256_ARM64=${{ env.RCLONE_SHA256_ARM64 }}
            TAILWIND_VERSION=${{ env.TAILWIND_VERSION }}
            HTMX_VERSION=${{ env.HTMX_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

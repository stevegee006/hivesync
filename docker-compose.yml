services:
  hivesync:
    build:
      context: .
      # Explicit, so this can never pick up a later stage by accident.
      target: runtime
      args:
        RCLONE_VERSION: ${RCLONE_VERSION:-1.74.4}
        TAILWIND_VERSION: ${TAILWIND_VERSION:-4.3.3}
        HTMX_VERSION: ${HTMX_VERSION:-2.0.10}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.15.12}
    image: ${HIVESYNC_IMAGE:-hivesync:latest}
    container_name: hivesync
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Required. Generate with `make secret-key` and put it in .env.
      HIVESYNC_SECRET_KEY: ${HIVESYNC_SECRET_KEY:?set HIVESYNC_SECRET_KEY in .env, see .env.example}
      # Optional. Left empty, the first visitor creates the account from the
      # setup wizard. Set it to create the account at startup instead, which
      # closes the window in which an unclaimed instance is reachable. A
      # password change is forced at first login.
      HIVESYNC_ADMIN_USER: ${HIVESYNC_ADMIN_USER:-admin}
      HIVESYNC_ADMIN_PASSWORD: ${HIVESYNC_ADMIN_PASSWORD:-}
      HIVESYNC_AUTH_MODE: ${HIVESYNC_AUTH_MODE:-local}
      # Required when auth mode is trusted_header. The header is honoured only
      # when the socket peer is inside the allowlist. See app/security.py.
      HIVESYNC_TRUSTED_HEADER: ${HIVESYNC_TRUSTED_HEADER:-}
      HIVESYNC_TRUSTED_PROXIES: ${HIVESYNC_TRUSTED_PROXIES:-}
      # Bearer tokens for scripted access. Compose passes only what is listed
      # here, so a variable in .env that is missing from this block is silently
      # ignored: that is how the M8 tokens appeared to do nothing.
      HIVESYNC_API_TOKEN: ${HIVESYNC_API_TOKEN:-}
      HIVESYNC_METRICS_TOKEN: ${HIVESYNC_METRICS_TOKEN:-}
      HIVESYNC_MAX_CONCURRENT_RUNS: ${HIVESYNC_MAX_CONCURRENT_RUNS:-3}
      HIVESYNC_LOGIN_MAX_ATTEMPTS: ${HIVESYNC_LOGIN_MAX_ATTEMPTS:-5}
      HIVESYNC_LOGIN_LOCKOUT_SECONDS: ${HIVESYNC_LOGIN_LOCKOUT_SECONDS:-900}
      HIVESYNC_LOG_LEVEL: ${HIVESYNC_LOG_LEVEL:-info}
      TZ: ${TZ:-America/Denver}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./config:/config
      # Local filesystem connections mount here. Add your own, read only where
      # the job only reads. Permissions are managed on the host, not by the
      # container: see PUID and PGID above.
      # - /mnt/tank/media:/data/media
      # - /mnt/synology-media:/data/synology-media

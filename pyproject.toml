[project]
name = "hivesync"
version = "0.2.4"
description = "Dockerized file sync orchestrator that drives rclone and lftp"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2.0",
    "apscheduler>=3.10,<4.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "cryptography>=43,<47",
    "argon2-cffi>=23.1,<26",
    "itsdangerous>=2.2,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
# Pinned exactly, not ranged. These gate CI, and a range means the pipeline
# resolves a different ruff than the developer ran, so a locally clean tree still
# fails the build with rules that did not exist an hour earlier. Bumping them is
# a deliberate commit that shows the new findings.
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.1",
    "mypy==1.20.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "ANN",  # annotations
    "S",    # bandit
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "ANN401",  # Any is occasionally correct for JSON columns
]

[tool.ruff.lint.flake8-bugbear]
# Depends(...) in a parameter default is the FastAPI idiom, not the mutable
# default argument bug B008 is looking for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of tests, and the credential-shaped literals in them are
# fixtures. The real check that no secret escapes is tests/test_crypto.py.
# ANN001/ANN201: pytest fixtures are passed by name and their types add noise
# without adding safety, since mypy does not check the test tree anyway.
"tests/*" = ["S101", "S105", "S106", "S107", "ANN001", "ANN201"]
"migrations/*" = ["ANN", "E501"]         # generated-style migration bodies
# Captured rclone output, kept verbatim. Wrapping it would falsify the sample.
"tests/test_parsers.py" = ["E501"]
# S105 flags string literals whose name looks credential-like. In these three the
# literal is an identifier: an enum member describing a credential kind, or a
# settings key. No secret value appears in source anywhere.
"app/security.py" = ["S105"]
"app/models/credential.py" = ["S105"]
"app/models/setting.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so `app` and `tests` import without the project being installed.
# On a workstation the editable install already provides this; inside the test
# container it does not, and the integration suite runs there.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: requires docker-compose.test.yml fixtures",
    "slow: takes minutes of real wall clock time, for schedule verification",
]
